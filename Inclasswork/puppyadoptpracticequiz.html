<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Adoption Quiz Practice</title>
</head>
<body>

    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>


<form>

    <label for="firstname">First Name:</label>
    <input text="" id="firstname" placeholder="First Name">

    <label for="lastname">Last Name:</label>
    <input text="" id="lastname" placeholder="Last Name">
    
    <br></br>

    <label for="email">Email:</label>
    <input text="" id="useremail" placeholder="enter your email here">

    <br></br>

    <label for="password">Password: </label>
    <input text="" id="password" placeholder="enter password">

    
    <P>Are you over the age of 18?</P>
    <label for="age">No</label>
    <input type="radio" id="notadult">
    <label for="age">Yes</label>
    <input type="radio" id="adult">

    <p>Do you have a Credit Card or Paypal?</p>
    <select name="money">
        <option value="Credit Card">Credit</option> 
        <option value="Paypal">Paypal</option>
    </select>

    <br></br>

    <input type="submit" value="Submit">

</form>



</body>
</html>
